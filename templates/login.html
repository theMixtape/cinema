{% extends "base.html" %}

{% block content %}
<div style="min-height:70vh;display:grid;place-items:center;padding:40px 6%;">
  <div style="width:min(420px,100%);padding:32px;border:1px solid rgba(255,255,255,0.08);border-radius:16px;background:rgba(255,255,255,0.03);">
    <h1 style="font-family:var(--font-display);margin:0 0 16px;">Вхід в режим редагування</h1>
    {% if error %}<p style="color:#f87171;">{{ error }}</p>{% endif %}
    <form method="post" style="display:grid;gap:12px;">
      <input type="password" name="password" placeholder="Пароль" required style="padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#fff;">
      <button type="submit" style="padding:12px 14px;border-radius:10px;background:#3b82f6;color:#fff;border:none;">Увійти</button>
    </form>
  </div>
</div>
{% endblock %}
